aid: scorpion-therapeutics
name: Scorpion Therapeutics
description: 'Scorpion Therapeutics is a clinical-stage precision oncology biotechnology company
  founded in 2020 and headquartered in Boston, Massachusetts. It pursued what it called Precision
  Oncology 2.0 — integrating target discovery, medicinal chemistry and translational medicine to
  produce mutant-selective small-molecule cancer drugs — led by STX-478, an oral mutant-selective
  PI3K-alpha inhibitor in Phase 1/2 trials for breast cancer and other advanced solid tumors, and
  STX-721, a covalent EGFR/HER2 exon 20 inhibitor. In January 2025 Eli Lilly agreed to acquire
  Scorpion and its PI3K-alpha program in a transaction valued at up to $2.5 billion, with the
  non-PI3K-alpha pipeline and staff spun into a separate independent company. Scorpion is a drug
  developer, not a software vendor: it publishes no API, SDK, developer portal or machine-readable
  specification, and its own domain now redirects to the acquirer''s announcement.'
